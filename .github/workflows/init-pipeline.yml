name: CI/CD Pipeline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, dev, refactor]

jobs:
  lint-stage:
    uses: ./.github/workflows/test.yml

  build-stage:
    needs: lint-stage
    uses: ./.github/workflows/build.yml
